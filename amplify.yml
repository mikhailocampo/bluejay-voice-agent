version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Install bun if not available
        - curl -fsSL https://bun.sh/install | bash
        - export BUN_INSTALL="$HOME/.bun"
        - export PATH="$BUN_INSTALL/bin:$PATH"
        # Install dependencies
        - bun install
    build:
      commands:
        - export BUN_INSTALL="$HOME/.bun"
        - export PATH="$BUN_INSTALL/bin:$PATH"
        - echo "Checking for LIVEKIT vars..." && env | grep LIVEKIT || echo "No LIVEKIT vars found"
        - env | grep -e LIVEKIT_API_KEY -e LIVEKIT_API_SECRET -e LIVEKIT_URL >> .env.production
        - cat .env.production || echo ".env.production is empty"
        - bun run build
  artifacts:
    # IMPORTANT: Set baseDirectory to .next for SSR support
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
  # Pass environment variables to the compute layer
  environmentVariables:
    LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
    LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    LIVEKIT_URL: ${LIVEKIT_URL}
